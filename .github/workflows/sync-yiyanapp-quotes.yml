name: Sync official YiyanApp quotes

on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: "Number of Weibo pages to archive"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: sync-yiyanapp-quotes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official quote posts
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          SYNC_PAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.pages || '4' }}
        run: python scripts/sync_yiyanapp_quotes.py --pages "$SYNC_PAGES"
      - name: Commit archive updates
        run: |
          if git diff --quiet -- quotes/yiyanapp.json; then
            echo "No new official quotes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes/yiyanapp.json
          git commit -m "Update official YiyanApp quote archive"
          git push
